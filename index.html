<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDE3D1">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flâner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180-v2.png">
<title>Flâner</title>
<style>
  :root {
    --bg: #EDE3D1;          /* Sable */
    --card: #F8F3E8;        /* Papier */
    --field: #FFFCF5;
    --ink: #16253C;         /* Encre */
    --muted: #5E5747;
    --faint: #A0947D;
    --line: #DCCFB6;
    --line-strong: #C0B49B;
    --accent: #B8412C;      /* Vermillon */
    --accent-ink: #FFF8EC;
    --accent-soft: #F5E3DC;
    --gold: #B5822A;        /* Ocre */
    --ok: #4A6B52;          /* Sauge */
    --ok-soft: #E7EEE4;
    --ok-ink: #35503B;
    --err: #B8412C;
    --err-soft: #F5E3DC;
    --plate: #16253C;
    --plate-ink: #F8F3E8;
    --plate-line: #8C9AB0;
    --plate-mute: #C3B9A5;
    --plate-rail: #3A4A63;
    --plate-field: #22334F;
    --accent-on-plate: #E8836B;
    --gold-on-plate: #D7A34A;
    --ok-on-plate: #A8C9AE;
    --serif: "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 22px 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Kopfzeile */
  .top { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 12px; }
  .top h1 { font-family: var(--serif); font-weight: 500; font-size: 36px; margin: 0; line-height: 1; letter-spacing: -0.01em; }
  .top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .back { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 4px; margin-left: -12px; }
  .back:active { background: var(--accent-soft); }
  .headpts { margin-left: auto; text-align: right; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Zähler und mitlaufender Punktestand */
  .counter { margin-left: auto; text-align: right; position: relative; }
  .counter .of { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .counter .score { font-family: var(--serif); font-size: 21px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .counter .score.pop { animation: pop .45s ease; }
  .gain {
    position: absolute; right: 0; top: 44px;
    font-family: var(--serif); font-size: 21px; color: var(--gold);
    font-variant-numeric: tabular-nums; pointer-events: none;
    animation: rise 1s ease forwards;
  }
  @keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }

  .bar { height: 2px; background: var(--line); margin-bottom: 20px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

  /* Startseite */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .seg button { height: 44px; color: var(--ink); font-size: 15px; border-left: 1px solid var(--ink); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--ink); color: var(--bg); font-weight: 500; }

  .daily { display: block; width: 100%; text-align: left; background: var(--plate); border-radius: 6px; padding: 8px; margin-bottom: 16px; }
  .daily .keyline { border: 1px solid var(--plate-line); border-radius: 3px; padding: 22px 20px 20px; }
  .daily .keyline.slim { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 14px; }
  .daily.slim { padding: 5px; opacity: .9; margin-bottom: 10px; }
  .daily .keyline.slim .t { font-size: 19px; }
  .daily .keyline.slim .d { margin-top: 0; font-size: 13px; }
  .daily .t { font-family: var(--serif); font-size: 32px; color: var(--plate-ink); line-height: 1.1; }
  .daily .d { font-size: 15px; color: var(--plate-mute); margin-top: 8px; }
  .daily .rule { height: 1px; background: var(--plate-rail); margin: 18px 0 14px; }
  .daily .row { display: flex; align-items: center; gap: 10px; }
  .daily .track { flex: 1; height: 5px; background: var(--plate-rail); border-radius: 3px; overflow: hidden; }
  .daily .track i { display: block; height: 100%; background: var(--gold); }
  .daily .num { font-size: 13px; color: var(--plate-mute); font-variant-numeric: tabular-nums; }

  .mapbtn { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; margin-bottom: 18px; }
  .mapbtn .t { font-family: var(--serif); font-size: 21px; }
  .mapbtn .d { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .modules { list-style: none; margin: 0; padding: 0; }
  .modules li { border-bottom: 1px solid var(--line); }
  .modules li:last-child { border-bottom: 0; }
  .modules button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 15px 2px; }
  .modules .n { flex: 1; font-size: 17px; font-weight: 500; }
  .modules .n small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .modules .pct { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .modules .chev { color: var(--faint); display: flex; }
  .foot { margin-top: auto; padding-top: 14px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .foot button { text-decoration: underline; color: var(--muted); text-underline-offset: 3px; }
  .ver { display: block; width: 100%; text-align: left; color: var(--faint); font-size: 12px; padding: 10px 0 calc(env(safe-area-inset-bottom) + 12px); }

  /* Übungskarte */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 26px 22px 22px; margin-bottom: 16px; }
  .lang { font-family: var(--serif); font-size: 40px; line-height: 1.1; margin: 0; }
  .lang.small { font-size: 28px; }
  .lang.hidden { color: transparent; text-shadow: 0 0 14px var(--faint); user-select: none; }
  .ctx { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--muted); margin-top: 8px; }
  .de { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .prompt { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .theme { color: var(--muted); font-size: 13px; }
  .text { font-family: var(--serif); font-size: 21px; line-height: 1.5; margin: 0; }
  .text.hidden { color: transparent; text-shadow: 0 0 14px var(--faint); user-select: none; }
  .text.collapsed { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 16px; }
  .title { font-family: var(--serif); font-size: 15px; color: var(--muted); margin-bottom: 8px; }

  label.field { display: block; font-size: 13px; color: var(--muted); margin: 22px 0 7px; }
  input[type=text] {
    width: 100%; font-family: var(--serif); font-size: 26px; height: 56px; padding: 0 14px;
    border: 1px solid var(--ink); border-radius: 4px; background: var(--field); color: var(--ink);
  }
  input[type=text].ok { border-color: var(--ok); }
  input[type=text].err { border-color: var(--err); }

  .feedback { border-radius: 4px; padding: 14px 16px; margin-top: 16px; font-size: 15px; }
  .feedback.ok { background: var(--ok-soft); color: var(--ok-ink); }
  .feedback.err { background: var(--err-soft); color: var(--accent); }
  .feedback.hint { background: var(--accent-soft); color: var(--accent); }
  .feedback b { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--ink); display: block; margin-top: 6px; line-height: 1.2; }
  .feedback .de { margin-top: 2px; }
  .feedback .tip { font-family: var(--sans); font-size: 15px; color: var(--ink); margin-top: 8px; line-height: 1.5; opacity: .9; }
  .feedback .trap { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.5; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.08); }
  .feedback .gain { line-height: 1; }
  .feedback .mine { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .card .feedback .mine { color: var(--plate-mute); }

  .opts { display: grid; gap: 10px; margin-top: 16px; }
  .opts button { text-align: left; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--field); font-size: 17px; }
  .opts button.fr { font-family: var(--serif); font-size: 22px; }
  .opts button.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); }
  .opts button.err { border-color: var(--err); background: var(--err-soft); color: var(--accent); }
  .opts button:disabled { cursor: default; }

  .words { display: flex; flex-wrap: wrap; gap: 8px 6px; margin-top: 6px; }
  .words button { font-family: var(--serif); font-size: 25px; line-height: 1.2; padding: 6px 9px; border-radius: 4px; border: 1px solid transparent; background: var(--field); }
  .words button.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); }
  .words button.err { border-color: var(--err); background: var(--err-soft); color: var(--accent); text-decoration: line-through; }
  .words button:disabled { cursor: default; }

  .actions { display: grid; gap: 10px; margin-top: auto; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px); z-index: 2; }
  .actions:empty { display: none; }
  .actions.row { grid-template-columns: 1fr 1fr; }
  .btn { padding: 0 18px; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 4px; font-size: 16px; text-align: center; border: 1px solid var(--line-strong); background: transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .btn.ok { background: var(--ok); color: #FFF8EC; border-color: var(--ok); font-weight: 600; }
  .btn.quiet { color: var(--muted); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .inrow { display: flex; gap: 10px; margin-top: 14px; }
  .inrow .btn { flex: 1; }
  .listen { display: flex; gap: 10px; margin-top: 18px; }
  .listen .btn { flex: 1; }

  /* Ergebnis */
  .result { text-align: center; padding: 40px 0 20px; }
  .result .big { font-family: var(--serif); font-size: 96px; line-height: 1; font-variant-numeric: tabular-nums; }
  .result .of { color: var(--muted); font-size: 15px; margin-top: 10px; }
  .result .plate { display: inline-flex; align-items: baseline; gap: 8px; margin-top: 22px; padding: 9px 16px; background: var(--plate); border-radius: 3px; }
  .result .plate .p { font-family: var(--serif); font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .result .plate .l { font-size: 14px; color: var(--plate-mute); }
  .result p { color: var(--muted); font-size: 15px; margin-top: 30px; }
  .unlock { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px; margin-top: 34px; }
  .unlock .l { font-size: 13px; color: var(--muted); }
  .unlock .n { font-family: var(--serif); font-size: 30px; margin-top: 10px; }
  .unlock .s { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--muted); margin-top: 6px; }

  .note { color: var(--muted); font-size: 13px; margin-top: 12px; }

  /* Zuordnen */
  .match { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 66px; gap: 10px; margin-top: 8px; align-items: start; }
  .mbtn { height: 66px; align-self: start; vertical-align: top; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--field); font-size: 16px; line-height: 1.25; display: flex; align-items: center; justify-content: center; text-align: center; }
  .mbtn.fr { font-family: var(--serif); font-size: 20px; line-height: 1.15; }
  .mbtn.de { font-size: 15px; line-height: 1.2; }
  .mbtn.sel { border-color: var(--ink); background: var(--accent-soft); }
  .mbtn.done { border-color: var(--line); background: transparent; color: var(--faint); }
  .mbtn.wrong { border-color: var(--err); background: var(--err-soft); color: var(--accent); }

  /* Ergebnis */
  .result .big.gold { color: var(--gold); margin-top: 6px; }
  .result .tally { font-size: 15px; margin-top: 26px; }
  .result .goal { margin-top: 22px; text-align: left; }
  .result .goal .track { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .result .goal .track i { display: block; height: 100%; background: var(--gold); }
  .result .goal .g { font-size: 14px; color: var(--muted); margin-top: 8px; text-align: center; }
  .result .lvl .ticks { justify-content: center; }
  .result .lvl .ticks i { width: 10px; height: 18px; background: var(--line); }
  .result .lvl .ticks i.on { background: var(--gold); }
  .result .lvl .ticks i.half { background: linear-gradient(to top, var(--gold) 50%, var(--line) 50%); }

  /* Karte */
  .mapcard { padding: 4px 4px 0; margin-bottom: 10px; }
  .map { width: 100%; height: auto; display: block; }
  .map .route { fill: none; stroke: var(--line-strong); stroke-width: 1.6; stroke-dasharray: 4 5; }
  .map .route.done { stroke: var(--accent); stroke-dasharray: none; stroke-width: 2; opacity: .8; }
  .map .route.done.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s ease-out .3s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .map .route.done.draw { animation: none; stroke-dashoffset: 0; } .map .pulse { animation: none; } }
  .map .st { cursor: pointer; }
  .map .st .dot { fill: var(--faint); }
  .map .st.done .dot, .map .st.cur .dot { fill: var(--accent); }
  .map .st .place { font-family: var(--serif); font-size: 16px; fill: var(--faint); }
  .map .st.done .place { fill: var(--ink); }
  .map .st.cur .place { fill: var(--accent); font-weight: 600; }
  .map .pulse { fill: var(--accent); opacity: .18; animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes pulse { 0%, 100% { transform: scale(.8); opacity: .12; } 50% { transform: scale(1.15); opacity: .26; } }
  .stcard { display: block; width: 100%; text-align: left; background: var(--plate); color: var(--plate-ink); border-radius: 6px; padding: 14px 18px 14px; margin-bottom: 12px; }
  .stcard .l { font-size: 13px; color: var(--plate-mute); }
  .stcard .n { font-family: var(--serif); font-size: 28px; line-height: 1.1; margin-top: 2px; }
  .stcard .th { font-size: 15px; color: var(--plate-mute); margin-top: 4px; }
  .stcard .cta { margin-top: 10px; font-weight: 600; font-size: 16px; }
  .pills { display: flex; gap: 6px; margin-top: 10px; }
  .pills i { flex: 1; height: 6px; border-radius: 3px; background: var(--plate-rail); }
  .stcard .pills i.done { background: var(--gold); }
  .stcard .pills i.next { background: var(--plate-line); }
  .result .pills i { background: var(--line); }
  .result .pills i.done { background: var(--gold); }
  .etappen { display: flex; flex-direction: column; margin-top: 10px; }
  .et { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 2px; border-bottom: 1px solid var(--line); }
  .et:last-child { border-bottom: 0; }
  .et .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 17px; border: 1px solid var(--line-strong); color: var(--muted); }
  .et.done .num { background: var(--gold); border-color: var(--gold); color: #fff; }
  .et.next .num { border-color: var(--accent); color: var(--accent); }
  .et .lab { flex: 1; font-size: 16px; }
  .et .st { font-size: 13px; color: var(--muted); }
  .et.next .st { color: var(--accent); }
  .et:disabled { opacity: .45; cursor: default; }
  .conv { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .bubble { border-radius: 6px; padding: 14px 16px; max-width: 92%; }
  .bubble.npc { background: var(--card); border: 1px solid var(--line); align-self: flex-start; }
  .bubble.me { background: var(--plate); color: var(--plate-ink); align-self: flex-end; }
  .bubble .fr { font-family: var(--serif); font-size: 20px; line-height: 1.4; margin: 0; }
  .bubble.me .fr { color: var(--plate-ink); }
  .bubble .de { margin: 4px 0 8px; }
  .bubble .btn.quiet { min-height: 36px; font-size: 14px; padding: 0 12px; display: inline-flex; }
  .map .land { fill: var(--field); stroke: var(--line-strong); stroke-width: 1.4; }
  .map .place { font-family: var(--serif); font-size: 16px; fill: var(--faint); cursor: pointer; }
  .map .place.on { fill: var(--accent); font-weight: 600; }
  .map .glow { fill: var(--accent); opacity: .14; }
  .map .dot { fill: var(--faint); }
  .map .dot.on { fill: var(--accent); }
  .place-card .fr { font-family: var(--serif); font-size: 19px; line-height: 1.45; margin: 0; }
  .place-card .de { margin: 4px 0 14px; }
  .place-card .rule { height: 1px; background: var(--line); margin: 16px 0 14px; }

  textarea { width: 100%; font-family: var(--sans); font-size: 14px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--field); color: var(--ink); min-height: 110px; word-break: break-all; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-top: 10px; }

  /* Inhaltsflächen: Tinte auf Sand, überall gleich */
  .card { background: var(--plate); color: var(--plate-ink); border: 0; }
  .card .theme, .card .de, .card .ctx, .card .prompt, .card .title, .card .note, .card label.field { color: var(--plate-mute); }
  .card .lang, .card .text, .card .fr { color: var(--plate-ink); }
  .card .lang.hidden, .card .text.hidden { color: transparent; text-shadow: 0 0 14px var(--plate-mute); }
  .card .text.collapsed { color: var(--plate-mute); }
  .card input[type=text] { background: var(--plate-field); color: var(--plate-ink); border-color: var(--plate-line); }
  .card input[type=text].ok { border-color: var(--ok-on-plate); }
  .card input[type=text].err { border-color: var(--accent-on-plate); }
  .card .btn { color: var(--plate-ink); border-color: var(--plate-line); background: transparent; }
  .card .btn.quiet { color: var(--plate-mute); }
  .card .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .card .btn.dark { background: var(--plate-ink); color: var(--plate); border-color: var(--plate-ink); }
  .card .opts button, .card .words button, .card .mbtn { background: var(--plate-field); color: var(--plate-ink); border-color: var(--plate-line); }
  .card .words button { border-color: transparent; }
  .card .mbtn.sel { border-color: var(--plate-ink); background: var(--plate-rail); }
  .card .mbtn.done { background: transparent; border-color: var(--plate-rail); color: var(--plate-mute); }
  .card .opts button.ok, .card .words button.ok { border-color: var(--ok-on-plate); background: rgba(127,169,135,.16); color: var(--ok-on-plate); }
  .card .opts button.err, .card .words button.err, .card .mbtn.wrong { border-color: var(--accent-on-plate); background: rgba(232,131,107,.16); color: var(--accent-on-plate); }
  .card .feedback.ok { background: rgba(127,169,135,.16); color: var(--ok-on-plate); }
  .card .feedback.err { background: rgba(232,131,107,.16); color: var(--accent-on-plate); }
  .card .feedback.hint { background: rgba(215,163,74,.16); color: var(--gold-on-plate); }
  .card .feedback b, .card .feedback .tip { color: var(--plate-ink); }
  .card .feedback .trap { color: var(--plate-mute); border-top-color: rgba(255,255,255,.12); }

<body>
<div id="app"></div>
<script src="version.js"></script>
<script src="content.js"></script>
<script>
(function () {
  'use strict';
  const C = window.CONTENT;
  const STORE_KEY = 'francais-app-v1';
  const DAILY_MIX = { vocab: 8, articles: 3, match: 1, errors: 3, speak: 3, texts: 1, tenses: 4 };
  let SCOPE = null; // null = alle offenen Stationen, sonst eine Stations-ID
  // Punkte je Stufe: [richtig, mit Hilfe]
  // Punkte je Station: frühe Stationen geben weniger, späte mehr. [richtig, mit Hilfe]
  const POINTS_BY_IDX = [[2, 1], [2, 1], [3, 1], [3, 1], [3, 2], [4, 2], [4, 2]];
  let CUR_ITEM = null; // das gerade angezeigte Übungsobjekt (für Punkte und Schwierigkeit)
  const stIdx = id => Math.max(0, C.stations.findIndex(st => st.id === id));
  const P = () => POINTS_BY_IDX[stIdx(itemStation(CUR_ITEM))] || POINTS_BY_IDX[0];
  const itemStation = it => it ? (it.station || (it.ids ? (C.vocab.find(v => v.id === it.ids[0]) || {}).station : null)) : null;
  // Etappen: fünf je Station, jede ein Querschnitt durch alle Übungsarten derselben Situation
  const ETAPPE = [
    { vocab: 4, articles: 1, match: 1, errors: 1, speak: 1, tenses: 1 },
    { vocab: 4, articles: 1, errors: 1, speak: 1, tenses: 1, match: 1 },
    { vocab: 4, articles: 1, errors: 1, speak: 1, tenses: 1, texts: 1, match: 1 },
    { vocab: 4, articles: 1, errors: 1, speak: 1, tenses: 1, match: 1 },
    { vocab: 4, errors: 1, speak: 1, tenses: 1, texts: 1, match: 1, dialogs: 1 }
  ];
  let RUN = null; // Zusammenhang der laufenden Übungsreihe: { kind: 'daily'|'module'|'etappe', station, n }
  const MODULES = [
    { key: 'vocab',  name: 'Vocabulaire',     sub: 'Wörter eintippen' },
    { key: 'articles', name: 'Articles',      sub: 'le, la, l\' oder les' },
    { key: 'match',  name: 'Associer',        sub: 'Paare finden' },
    { key: 'errors', name: 'Trouver l\'erreur', sub: 'Ein Wort stimmt nicht' },
    { key: 'speak',  name: 'Répéter',         sub: 'Hören und nachsprechen' },
    { key: 'texts',  name: 'Comprendre',      sub: 'Kurzer Text, drei Fragen' },
    { key: 'tenses', name: 'Conjugaison',     sub: 'Die passende Form' },
    { key: 'dialogs', name: 'Dialogue',       sub: 'Drei Antworten, eine passt' }
  ];

  // ---------- Speicher ----------
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === 'object') return s;
    } catch (e) {}
    return { direction: 'de-fr', vocab: {}, done: {}, daily: null, points: 0, prog: {} };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  const S = load();
  S.vocab = S.vocab || {}; S.done = S.done || {}; S.direction = S.direction || 'de-fr'; S.points = S.points || 0; S.prog = S.prog || {};
  if (S.autoRead === undefined) S.autoRead = true;
  if (S.sound === undefined) S.sound = true;

  // ---------- Symbole ----------
  const ICON = {
    back: '<svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9.5 1 L1.5 9 L9.5 17"/></svg>',
    chev: '<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 1 L7 7 L1 13"/></svg>',
    sound: '<svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 6.5 L5.5 6.5 L9.5 3 L9.5 15 L5.5 11.5 L2 11.5 Z"/><path d="M12.6 6.2 A4 4 0 0 1 12.6 11.8"/></svg>',
    hex: '<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M17 3.5 L28.7 10.25 L28.7 23.75 L17 30.5 L5.3 23.75 L5.3 10.25 Z"/><circle cx="18.5" cy="14" r="2.2" fill="currentColor" stroke="none"/></svg>',
    mic: '<svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="1" width="6" height="10" rx="3"/><path d="M2 8.5a6 6 0 0 0 12 0M8 14.5V17M5.5 17h5"/></svg>'
  };

  // ---------- Helfer ----------
  const app = document.getElementById('app');
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const today = () => new Date().toISOString().slice(0, 10);
  // Stationen: offen ist die erste plus jede, deren Vorgängerin alle fünf Etappen hat
  const progOf = id => S.prog[id] || 0;
  function openedStations() {
    const out = [];
    for (const st of C.stations) { out.push(st.id); if (progOf(st.id) < 5) break; }
    return out;
  }
  const currentStation = () => C.stations.find(st => progOf(st.id) < 5) || C.stations[C.stations.length - 1];
  const byLevel = (list) => { const open = SCOPE ? [SCOPE] : openedStations(); return list.filter(x => open.includes(x.station)); };
  const ofStation = (list, id) => list.filter(x => x.station === id);
  const findItem = (type, id) => C[type].find(x => x.id === id);

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[’`´]/g, "'")
      .replace(/œ/g, 'oe').replace(/æ/g, 'ae').replace(/ß/g, 'ss')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[.!?,;:]/g, '')
      .replace(/\s+/g, ' ').trim();
  }
  const ART_FR = /^(le|la|les|un|une|des|l')\s*/;
  const ART_DE = /^(der|die|das|ein|eine)\s+/;
  function stripArticle(s, lang) { return norm(s).replace(lang === 'fr' ? ART_FR : ART_DE, '').trim(); }
  function hasArticle(s, lang) { return (lang === 'fr' ? ART_FR : ART_DE).test(norm(s)); }

  // ---------- Sprachausgabe ----------
  let voice = null;
  const FEMALE = /aur[ée]lie|am[ée]lie|audrey|marie|chantal|c[ée]line|l[ée]a|virginie|female|femme|-vlf-|sabrina|zoe|zoé/i;
  const MALE = /thomas|daniel|nicolas|-vlm-|male|homme/i;
  function frVoices() {
    if (!('speechSynthesis' in window)) return [];
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    // fr-FR zuerst, dann übrige französische Stimmen
    return vs.sort((a, b) => (b.lang.toLowerCase() === 'fr-fr') - (a.lang.toLowerCase() === 'fr-fr'));
  }
  function pickVoice() {
    const vs = frVoices();
    if (!vs.length) { voice = null; return; }
    if (S.voiceName) { const chosen = vs.find(v => v.name === S.voiceName); if (chosen) { voice = chosen; return; } }
    voice = vs.find(v => FEMALE.test(v.name) && !MALE.test(v.name)) || vs.find(v => !MALE.test(v.name)) || vs[0];
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, rate) {
    if (!('speechSynthesis' in window)) { alert('Dieser Browser kann keine Sprachausgabe.'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = C.meta.lang; u.rate = rate || 0.95;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  // ---------- Töne ----------
  let actx = null;
  function tone(freq, dur, at, type, vol) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(at); o.stop(at + dur + 0.05);
  }
  function ensureAudio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') return actx.resume();
    } catch (e) {}
    return Promise.resolve();
  }
  // Browser geben Ton erst nach einer Berührung frei. Der erste Tipp irgendwo in der App reicht,
  // danach klappt es auch bei Antworten, die über die Tastatur abgeschickt werden.
  document.addEventListener('touchend', () => { if (S.sound) ensureAudio(); }, { passive: true });
  document.addEventListener('pointerdown', () => { if (S.sound) ensureAudio(); }, { passive: true });
  function buzz(kind) { try { if (navigator.vibrate) navigator.vibrate(kind === 'err' ? 40 : kind === 'unlock' ? [30, 60, 30] : 15); } catch (e) {} }
  function sfx(kind) {
    buzz(kind);
    if (!S.sound) return;
    ensureAudio().then(() => {
      if (!actx) return;
      const t = actx.currentTime + 0.01;
      if (kind === 'ok') { tone(523, 0.16, t); tone(784, 0.22, t + 0.11); }
      else if (kind === 'err') { tone(196, 0.22, t, 'triangle', 0.1); }
      else if (kind === 'unlock') { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, t + i * 0.13)); }
    }).catch(() => {});
  }

  // ---------- Fortschritt ----------
  function vocabLevel(id) { return (S.vocab[id] && S.vocab[id].lvl) || 0; }
  function bumpVocab(id, delta) {
    const v = S.vocab[id] || { lvl: 0, last: 0 };
    v.lvl = Math.max(0, Math.min(3, v.lvl + delta)); v.last = Date.now();
    S.vocab[id] = v; save();
  }
  function markDone(type, id, correct) { S.done[type] = S.done[type] || {}; S.done[type][id] = correct ? 2 : 1; save(); }
  function isDone(type, id) { return !!(S.done[type] && S.done[type][id]); }

  function moduleProgress(key) {
    // Niveau bezogen auf die offenen Stationen. Öffnet eine neue Station, wächst die Skala, das Niveau kann dann sinken.
    const all = byLevel(C[key === 'match' ? 'vocab' : key] || []);
    const mastered = key === 'vocab' || key === 'match' ? all.filter(x => vocabLevel(x.id) >= 2).length : all.filter(x => S.done[key] && S.done[key][x.id] === 2).length;
    const level10 = all.length ? Math.floor(20 * mastered / all.length) / 2 : 0;
    if (key === 'match') { const v = byLevel(C.vocab); return { text: '', pct: 0, level10, empty: v.length < 4 }; }
    const items = byLevel(C[key]);
    if (!items.length) return { text: 'noch keine Inhalte', pct: 0, level10, empty: true };
    if (key === 'vocab') {
      const learned = items.filter(v => vocabLevel(v.id) >= 2).length;
      return { text: learned + ' von ' + items.length + ' sitzen', pct: learned / items.length, level10 };
    }
    // Zählt nur richtig gelöste Aufgaben, nicht bloß gesehene
    const done = items.filter(x => S.done[key] && S.done[key][x.id] === 2).length;
    return { text: done + ' von ' + items.length + ' sitzen', pct: done / items.length, level10 };
  }

  // ---------- Auswahl der Übungen ----------
  function pickVocab(n) {
    const items = byLevel(C.vocab).map(v => ({ v, lvl: vocabLevel(v.id), last: (S.vocab[v.id] || {}).last || 0, r: Math.random() }));
    items.sort((a, b) => a.lvl - b.lvl || a.last - b.last || a.r - b.r);
    return items.slice(0, n).map(x => ({ type: 'vocab', id: x.v.id }));
  }
  function pickOther(type, n) {
    const items = byLevel(C[type]);
    // Zuerst nie Gesehenes, dann das am längsten nicht Gesehene, damit sich nichts zu schnell wiederholt
    const seen = (S.seen && S.seen[type]) || {};
    const ranked = shuffle(items).sort((a, b) => (seen[a.id] || 0) - (seen[b.id] || 0));
    return ranked.slice(0, n).map(x => ({ type, id: x.id }));
  }
  function pickMatch() {
    // 5 Paare, bevorzugt aus der Stufe, gemischte Wortarten sind hier gewollt
    const pool = shuffle(byLevel(C.vocab).length >= 5 ? byLevel(C.vocab) : C.vocab).slice(0, 5);
    return { type: 'match', id: 'm' + Date.now().toString(36), ids: pool.map(v => v.id) };
  }
  function buildQueue(type) {
    if (type === 'vocab') return pickVocab(10);
    if (type === 'match') return [pickMatch()];
    const counts = { errors: 5, speak: 4, texts: 1, tenses: 5, articles: 6, dialogs: 1 };
    return pickOther(type, counts[type]);
  }
  function buildEtappe(sid, n) {
    const recipe = ETAPPE[n - 1] || ETAPPE[0];
    const q = [];
    Object.keys(recipe).forEach(type => {
      const k = recipe[type];
      if (type === 'match') { const pool = ofStation(C.vocab, sid); if (pool.length >= 4) q.push({ type: 'match', id: 'm' + sid + n, ids: shuffle(pool).slice(0, 5).map(v => v.id) }); return; }
      const items = ofStation(C[type] || [], sid);
      if (!items.length) return;
      const start = ((n - 1) * k) % items.length;
      for (let i = 0; i < Math.min(k, items.length); i++) q.push({ type, id: items[(start + i) % items.length].id });
    });
    // Dialog immer zum Schluss, Rest gemischt
    const dlg = q.filter(x => x.type === 'dialogs');
    return shuffle(q.filter(x => x.type !== 'dialogs')).concat(dlg);
  }
  function buildDaily() {
    return shuffle([]
      .concat(pickVocab(DAILY_MIX.vocab))
      .concat(pickOther('articles', DAILY_MIX.articles))
      .concat([pickMatch()])
      .concat(pickOther('errors', DAILY_MIX.errors))
      .concat(pickOther('speak', DAILY_MIX.speak))
      .concat(pickOther('texts', DAILY_MIX.texts))
      .concat(pickOther('tenses', DAILY_MIX.tenses)));
  }
  function dailyState() {
    const key = openedStations().join(',');
    if (!S.daily || S.daily.date !== today() || S.daily.scope !== key) {
      SCOPE = null;
      S.daily = { date: today(), scope: key, items: buildDaily(), results: [] };
      save();
    }
    return S.daily;
  }

  // ---------- Karte (Umriss, vereinfacht) ----------
  const FR_OUTLINE = [[2.4,51.05],[1.85,50.95],[1.6,50.4],[1.4,50.06],[0.7,49.85],[0.1,49.5],[-0.3,49.35],[-1.1,49.35],[-1.6,49.65],[-1.85,49.1],[-1.5,48.64],[-2.0,48.65],[-2.7,48.55],[-3.5,48.8],[-4.5,48.4],[-4.75,48.03],[-4.1,47.98],[-3.4,47.75],[-2.75,47.65],[-2.2,47.27],[-1.8,46.5],[-1.15,46.15],[-1.0,45.6],[-1.2,44.65],[-1.55,43.48],[-1.78,43.37],[-0.5,42.8],[0.7,42.8],[1.7,42.5],[3.05,42.45],[3.0,43.1],[3.7,43.4],[4.1,43.55],[4.9,43.4],[5.4,43.3],[5.93,43.1],[6.65,43.27],[7.27,43.7],[7.5,43.78],[7.0,44.2],[6.9,45.0],[7.1,45.5],[6.8,46.0],[6.1,46.2],[6.0,46.5],[6.9,47.3],[7.6,47.6],[8.1,48.6],[8.2,49.0],[7.3,49.1],[6.4,49.5],[5.5,49.5],[4.9,50.0],[4.2,49.95],[4.1,50.1],[3.6,50.4],[3.2,50.7]];
  const CORSICA = [[9.4,43.0],[9.55,42.6],[9.35,41.5],[9.0,41.4],[8.7,41.9],[8.6,42.3],[9.3,42.7]];
  // Zwischenpunkte, damit die Route über Land führt (grob entlang echter Strecken)
  const WAYPOINTS = {
    'brest-bordeaux': [[-1.68, 48.11], [-1.55, 47.22]],            // Rennes, Nantes
    'bordeaux-marseille': [[1.44, 43.6], [3.88, 43.61]],           // Toulouse, Montpellier
    'lyon-strasbourg': [[5.04, 47.32], [6.02, 47.24]],             // Dijon, Besançon
    'strasbourg-paris': [[6.18, 48.69], [4.03, 49.26]]             // Nancy, Reims
  };
  function routePoints(fromIdx, toIdx) {
    const a = C.stations[fromIdx], b = C.stations[toIdx];
    const mid = WAYPOINTS[a.id + '-' + b.id] || [];
    return [[a.lon, a.lat]].concat(mid, [[b.lon, b.lat]]).map(p => proj(p[0], p[1]));
  }
  const proj = (lon, lat) => [+((lon + 5.4) * 28).toFixed(1), +((51.4 - lat) * 40.5).toFixed(1)];
  const pathOf = pts => 'M' + pts.map(p => proj(p[0], p[1]).join(',')).join('L') + 'Z';
  const svgNS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs) => { const n = document.createElementNS(svgNS, tag); Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k])); return n; };

  function buildMap(onTap) {
    const svg = sv('svg', { viewBox: '10 8 415 400', class: 'map' });
    svg.appendChild(sv('path', { d: pathOf(FR_OUTLINE) + ' ' + pathOf(CORSICA), class: 'land' }));
    const open = openedStations(), cur = currentStation();
    // Route: gestrichelte Linie durch alle Stationen, der bereits gereiste Teil kräftig.
    // Das zuletzt freigeschaltete Stück zeichnet sich einmal langsam nach.
    const pts = C.stations.map(st => proj(st.lon, st.lat));
    const doneIdx = open.length - 1;
    for (let i = 0; i < C.stations.length - 1; i++) {
      const seg = routePoints(i, i + 1).map(p => p.join(',')).join(' ');
      const isDone = i < doneIdx;
      const animate = isDone && S.anim === C.stations[i + 1].id;
      const line = sv('polyline', { points: seg, class: 'route' + (isDone ? ' done' : '') + (animate ? ' draw' : '') });
      if (animate) line.setAttribute('pathLength', '1');
      svg.appendChild(line);
    }
    if (S.anim) { delete S.anim; save(); }
    C.stations.forEach((st, i) => {
      const [x, y] = pts[i];
      const state = progOf(st.id) >= 5 ? 'done' : st.id === cur.id ? 'cur' : 'locked';
      const g = sv('g', { class: 'st ' + state });
      if (state === 'cur') g.appendChild(sv('circle', { cx: x, cy: y, r: 14, class: 'pulse' }));
      g.appendChild(sv('circle', { cx: x, cy: y, r: state === 'locked' ? 2.6 : 4, class: 'dot' }));
      const left = st.lon > 6.5;
      const t = sv('text', { x: x + (left ? -8 : 8), y: y + 4 + (st.dy || 0), class: 'place' });
      if (left) t.setAttribute('text-anchor', 'end');
      t.textContent = st.name;
      g.appendChild(t);
      g.onclick = () => onTap(st);
      svg.appendChild(g);
    });
    return svg;
  }

  // ---------- Verlauf und Wischen ----------
  // Jeder Bildschirm meldet, was Zurück bedeutet. Browserverlauf und Wischgeste vom linken Rand nutzen dasselbe.
  let BACK = null, POPPING = false;
  function screen(backFn) {
    BACK = backFn;
    if (backFn && !POPPING) { try { history.pushState({ f: 1 }, ''); } catch (e) {} }
    POPPING = false;
  }
  window.addEventListener('popstate', () => { if (BACK) { POPPING = true; if ('speechSynthesis' in window) speechSynthesis.cancel(); BACK(); } });
  let tx = 0, ty = 0, tEdge = false;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tEdge = tx < 28; }, { passive: true });
  document.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dy) > 60) return;
    if (tEdge && dx > 70 && BACK) { if ('speechSynthesis' in window) speechSynthesis.cancel(); BACK(); return; }
    // nach links wischen = Continuer, nur wenn der Knopf gerade da ist
    if (!tEdge && dx < -80) { const b = app.querySelector('.actions .btn.dark'); if (b && !b.disabled) b.click(); }
  }, { passive: true });

      '<div class="pills">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= n ? 'done' : i === n + 1 ? 'next' : '') + '"></i>').join('') + '</div>' +
      '<div class="cta">' + (n >= 5 ? 'Voir la station' : 'Commencer l’étape ' + (n + 1)) + '</div>';

  }

  // ---------- Ablauf einer Übungsreihe ----------
  // queue: [{type, id}], results: [{correct}], daily: true wenn Tagesprogramm (Ergebnisse werden gespeichert)
  function runQueue(queue, results, ctx) {
    RUN = ctx || { kind: 'module' };
    if (!queue.length) { renderHome(); return; }
    const idx = results.length;
    if (idx >= queue.length) { renderResult(results, RUN); return; }
    const ref = queue[idx];
    const item = ref.type === 'match' ? ref : findItem(ref.type, ref.id);
    CUR_ITEM = item;
    const mod = MODULES.find(m => m.key === ref.type) || { name: 'Dialog' };
    const daily = RUN.kind === 'daily';
    const stName = (C.stations.find(x => x.id === (RUN.station || itemStation(item))) || {}).name || '';
    const headline = daily ? 'Programme du jour' : RUN.kind === 'etappe' ? 'Étape ' + RUN.n + ', ' + stName : mod.name;
    const subline = daily || RUN.kind === 'etappe' ? mod.name : stName || 'Exercices libres';

    app.innerHTML = '';
    const top = el('div', 'top');
    const back = el('button', 'back', ICON.back);
    back.setAttribute('aria-label', 'Zurück');
    const goBack = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); if (RUN.from === 'station' && RUN.station) renderStation(RUN.station); else if (RUN.kind === 'module') renderModules(); else renderHome(); };
    back.onclick = goBack;
    if (idx === 0) screen(goBack); else BACK = goBack;
    top.appendChild(back);
    top.appendChild(el('div', '', '<div>' + esc(headline) + '</div><div class="sub">' + esc(subline) + '</div>'));
    const counter = el('div', 'chip');
    counter.innerHTML = '<b class="score">' + S.points + '</b><span>points</span>';
    top.appendChild(counter);
    app.appendChild(top);
    const bar = el('div', 'bar', '<i></i>');
    app.appendChild(bar);
    app.appendChild(el('div', 'barline', '<span>Exercice ' + (idx + 1) + ' sur ' + queue.length + '</span>'));
    requestAnimationFrame(() => { bar.firstChild.style.width = (idx / queue.length * 100) + '%'; });

    const body = el('div');
    app.appendChild(body);
    const actions = el('div', 'actions');
    app.appendChild(actions);

    // say: französischer Text, der nach der Auflösung automatisch vorgelesen wird
    const finish = (correct, pts, say) => {
      pts = pts || 0;
      const from = S.points;
      results.push({ type: ref.type, id: ref.id, correct: !!correct, pts });
      S.seen = S.seen || {}; S.seen[ref.type] = S.seen[ref.type] || {}; S.seen[ref.type][ref.id] = Date.now();
      S.points += pts;
      save();
      if (ref.type !== 'match' && ref.type !== 'texts' && ref.type !== 'dialogs') sfx(correct ? 'ok' : 'err');
      if (say && S.autoRead) setTimeout(() => speak(say), 550);
      if (pts > 0) awardPoints(counter, from, S.points, pts);
      actions.className = 'actions';
      actions.innerHTML = '';
      const next = el('button', 'btn dark', idx + 1 < queue.length ? 'Continuer' : 'Terminer');
      next.onclick = () => runQueue(queue, results, RUN);
      actions.appendChild(next);
      next.focus();
    };

    RENDER[ref.type](item, body, actions, finish);
  }

  // Punktestand im Kopf hochzählen und den Zugewinn kurz einblenden
  function awardPoints(counter, from, to, pts) {
    const score = counter.querySelector('.score');
    if (!score) return;
    // Zugewinn steht in der Rückmeldung, der Chip zählt hoch
    const fbs = app.querySelectorAll('.feedback'); const fb = fbs[fbs.length - 1];
    if (fb) fb.insertBefore(el('span', 'gain', '+' + pts), fb.firstChild);
    score.classList.add('pop');
    setTimeout(() => score.classList.remove('pop'), 500);
    const slow = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (slow) { score.textContent = to; return; }
    const steps = Math.min(pts, 8), dur = 420;
    let i = 0;
    const tick = setInterval(() => {
      i++;
      score.textContent = Math.round(from + (to - from) * (i / steps));
      if (i >= steps) { clearInterval(tick); score.textContent = to; }
    }, dur / steps);
  }

  // Erklärkasten: bei richtig kurz, bei falsch mit Stolperstein
  function explainBox(ok, head, item) {
    let html = '<div class="feedback ' + (ok ? 'ok' : 'err') + '">' + head;
    const rule = item.explain || item.tip;
    if (rule) html += '<div class="tip">' + esc(rule) + '</div>';
    if (!ok && item.trap) html += '<div class="trap">' + esc(item.trap) + '</div>';
    return html + '</div>';
  }

  // Schwierigkeit 1 bis 3: in Etappen nach Etappennummer, sonst nach Station
  function difficulty() {
    if (RUN && RUN.kind === 'etappe') return RUN.n <= 2 ? 1 : RUN.n <= 4 ? 2 : 3;
    const i = stIdx(itemStation(CUR_ITEM));
    return i <= 1 ? 1 : i <= 4 ? 2 : 3;
  }

  const RENDER = {};

  // Vokabel: eintippen, Hilfe mit 4 Optionen
  RENDER.vocab = function (v, body, actions, finish) {
    const toFr = S.direction === 'de-fr';
    const prompt = toFr ? v.de : v.fr;
    const target = toFr ? v.fr : v.de;
    const lang = toFr ? 'fr' : 'de';
    const accepted = [target].concat(toFr ? (v.alt || []) : (v.altDe || [])).map(norm);
    const ctx = toFr ? v.ctxDe : v.ctxFr;

    const card = el('div', 'card');
    card.appendChild(el('div', 'theme', esc(v.theme)));
    const big = el('p', 'lang' + (toFr ? '' : ' small'), esc(prompt));
    card.appendChild(big);
    const ctxEl = ctx ? el('div', 'ctx', esc(ctx)) : null;
    if (ctxEl) card.appendChild(ctxEl);
    const listenBtn = el('button', 'btn quiet', ICON.sound + ' Écouter');
    listenBtn.style.marginTop = '14px';
    listenBtn.onclick = () => speak(v.fr);
    if (!toFr) card.appendChild(listenBtn);
    // Nach der Antwort steht oben immer: Französisch groß, Deutsch klein, ein Anhören-Knopf
    function showSolution() {
      big.className = 'lang small'; big.textContent = v.fr;
      const small = el('div', 'de', esc(v.de));
      big.after(small);
      if (ctxEl) ctxEl.remove();
      if (!listenBtn.parentNode) small.after(listenBtn);
    }
    const lab = el('label', 'field', toFr ? 'Wie heißt das auf Französisch?' : 'Wie heißt das auf Deutsch?');
    lab.setAttribute('for', 'answer');
    const input = el('input');
    input.type = 'text'; input.id = 'answer'; input.autocapitalize = 'off'; input.autocomplete = 'off'; input.spellcheck = false; input.placeholder = 'mit Artikel'; input.setAttribute('enterkeyhint', 'done');
    input.setAttribute('lang', toFr ? 'fr' : 'de');
    card.appendChild(lab); card.appendChild(input);
    const fb = el('div');
    card.appendChild(fb);
    body.appendChild(card);

    let articleHintGiven = false;
    let settled = false;

    const check = el('button', 'btn primary', 'Vérifier');
    const help = el('button', 'btn', 'Aide');
    const row = el('div', 'inrow');
    row.appendChild(help); row.appendChild(check);
    card.insertBefore(row, fb);

    function reveal(ok, delta) {
      settled = true;
      input.disabled = true;
      input.className = ok ? 'ok' : 'err';
      showSolution();
      const mine = ok ? '' : '<div class="mine">Deine Antwort: <s>' + esc(input.value.trim()) + '</s></div>';
      fb.innerHTML = explainBox(ok, (ok ? 'Exact.' : 'Presque.') + '<b>' + esc(target) + '</b>' + mine, v);
      bumpVocab(v.id, delta);
      row.remove();
      finish(ok, ok ? P()[0] : 0, v.fr);
    }

    function doCheck() {
      if (settled) return;
      const a = norm(input.value);
      if (!a) { input.focus(); return; }
      if (accepted.includes(a)) { reveal(true, +1); return; }
      const targetHasArticle = hasArticle(target, lang);
      if (targetHasArticle && !articleHintGiven && !hasArticle(a, lang) && a === stripArticle(target, lang)) {
        articleHintGiven = true;
        fb.innerHTML = '<div class="feedback hint">Presque. Der Artikel fehlt noch.</div>';
        input.focus();
        return;
      }
      reveal(false, -1);
    }
    check.onclick = doCheck;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doCheck(); } });

    help.onclick = () => {
      if (settled) return;
      settled = true;
      input.disabled = true;
      // Ablenker: gleiche Wortart und gleiches Thema, sonst gleiche Wortart, sonst alles
      const pool = C.vocab.filter(x => x.id !== v.id && norm(toFr ? x.fr : x.de) !== norm(target));
      const samePos = pool.filter(x => x.pos === v.pos);
      const samePosTheme = samePos.filter(x => x.theme === v.theme);
      let picked = shuffle(samePosTheme).slice(0, 3);
      if (picked.length < 3) picked = picked.concat(shuffle(samePos.filter(x => !picked.includes(x))).slice(0, 3 - picked.length));
      if (picked.length < 3) picked = picked.concat(shuffle(pool.filter(x => !picked.includes(x))).slice(0, 3 - picked.length));
      const distract = picked.map(x => toFr ? x.fr : x.de);
      const opts = el('div', 'opts');
      shuffle([target].concat(distract)).forEach(o => {
        const b = el('button', toFr ? 'fr' : '', esc(o));
        b.onclick = () => {
          const ok = norm(o) === norm(target);

  // Zuordnen: fünf Paare, links Französisch (ab Stufe 2 nur zu hören), rechts Deutsch
  RENDER.match = function (m, body, actions, finish) {
    const words = m.ids.map(id => C.vocab.find(v => v.id === id)).filter(Boolean);
    const byEar = difficulty() >= 2;
    const card = el('div', 'card');
    card.appendChild(el('div', 'prompt', byEar ? 'Was gehört zusammen? Links anhören.' : 'Was gehört zusammen?'));
    const grid = el('div', 'match');
    const left = shuffle(words), right = shuffle(words);
    const btns = { fr: [], de: [] };
    let sel = null, pairs = 0, mistakes = 0, locked = false;
    const erred = {};

    function make(side, v) {
      const b = el('button', 'mbtn ' + side);
      if (side === 'fr' && byEar) { b.innerHTML = ICON.sound; b.setAttribute('aria-label', 'Anhören'); }
      else b.textContent = side === 'fr' ? v.fr : v.de;
      b.dataset.id = v.id;
      b.onclick = () => tap(side, v, b);
      btns[side].push(b);
      return b;
    }
    function clearSel() { if (sel) sel.btn.classList.remove('sel'); sel = null; }
    function tap(side, v, b) {
      if (locked || b.disabled) return;
      if (side === 'fr') speak(v.fr);
      if (sel && sel.btn === b) { clearSel(); return; }
      if (sel && sel.side === side) { clearSel(); }
      if (!sel) { sel = { side, v, btn: b }; b.classList.add('sel'); return; }
      // zweiter Tipp auf der anderen Seite
      const a = sel; clearSel();
      if (a.v.id === v.id) {
        sfx('ok');
        bumpVocab(v.id, erred[v.id] ? 0 : 1);
        [a.btn, b].forEach(x => { x.classList.add('done'); x.disabled = true; });
        const frBtn = a.side === 'fr' ? a.btn : b;
        if (byEar) frBtn.innerHTML = esc(v.fr);
        pairs++;
        if (pairs === words.length) {
          const pts = Math.max(0, words.length * P()[1] - mistakes);
          fb.innerHTML = '<div class="feedback ' + (mistakes ? 'hint' : 'ok') + '">' + (mistakes ? mistakes + (mistakes === 1 ? ' Fehlversuch' : ' Fehlversuche') + '.' : 'Parfait, sans erreur.') + '</div>';
          finish(mistakes === 0, pts);
        }
      } else {
        sfx('err');
        erred[a.v.id] = true; erred[v.id] = true;
        mistakes++; locked = true;
        [a.btn, b].forEach(x => x.classList.add('wrong'));
        setTimeout(() => { [a.btn, b].forEach(x => x.classList.remove('wrong')); locked = false; }, 550);
      }
    }
    for (let i = 0; i < words.length; i++) { grid.appendChild(make('fr', left[i])); grid.appendChild(make('de', right[i])); }
    card.appendChild(grid);
    const fb = el('div');
    card.appendChild(fb);
    body.appendChild(card);
  };

  // Dialog: Gegenüber spricht, drei Antworten, die passende zählt
  RENDER.dialogs = function (d, body, actions, finish) {
    let turn = 0, right = 0;
    const card = el('div', 'card');
    card.appendChild(el('div', 'theme', esc(d.title)));
    if (d.intro) card.appendChild(el('div', 'de', esc(d.intro)));
    body.appendChild(card);
    const conv = el('div', 'conv');
    body.appendChild(conv);

    function showTurn() {
      const t = d.turns[turn];
      const npc = el('div', 'bubble npc');
      npc.innerHTML = '<p class="fr">' + esc(t.npc) + '</p><div class="de tr" style="display:none">' + esc(t.npcDe) + '</div>';
      const row = el('div', 'listen'); row.style.marginTop = '8px';
      const listen = el('button', 'btn quiet', ICON.sound + ' Écouter'); listen.onclick = () => speak(t.npc);
      const trb = el('button', 'btn quiet', 'Traduction');
      let helpedTurn = false;
      trb.onclick = () => { helpedTurn = true; conv.querySelectorAll('.tr').forEach(x => x.style.display = ''); trb.remove(); };
      row.appendChild(listen); row.appendChild(trb);
      npc.appendChild(row);
      conv.appendChild(npc);
      if (S.autoRead) speak(t.npc);
      const opts = el('div', 'opts');
      const fb = el('div');
      shuffle(t.options.map((o, i) => ({ o, i }))).forEach(({ o, i }) => {
        const b = el('button', 'fr', '<span style="display:block">' + esc(o.fr) + '</span><span class="de tr" style="display:none;font-family:var(--sans);font-size:13px;margin-top:2px">' + esc(o.de) + '</span>');
        b.onclick = () => {
          const ok = !!o.ok;
          if (ok) right += helpedTurn ? 0.5 : 1;
          trb.remove();
          conv.querySelectorAll('.tr').forEach(x => x.style.display = '');
          Array.from(opts.children).forEach(c => { c.disabled = true; if (t.options[c.dataset.i].ok) c.classList.add('ok'); else if (c !== b) c.style.display = 'none'; });
          if (!ok) b.classList.add('err');
          sfx(ok ? 'ok' : 'err');
          const best = t.options.find(x => x.ok);
          fb.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'err') + '">' + (ok ? 'Parfait.' : 'Mieux : ') + (ok ? '' : '<b>' + esc(best.fr) + '</b>') + (o.note ? '<div class="tip">' + esc(o.note) + '</div>' : '') + '</div>';
          if (S.autoRead) setTimeout(() => speak(best.fr), 500);
          // die gewählte Antwort als eigene Sprechblase
          const me = el('div', 'bubble me'); me.innerHTML = '<p class="fr">' + esc(best.fr) + '</p>';
          turn++;
          actions.innerHTML = '';
          const next = el('button', 'btn dark', turn < d.turns.length ? 'Continuer' : 'Terminer');
          next.onclick = () => {
            opts.remove(); fb.remove(); conv.appendChild(me);
            actions.innerHTML = '';
            if (turn < d.turns.length) showTurn();
            else { markDone('dialogs', d.id, right === d.turns.length); finish(right === d.turns.length, Math.round(right * P()[0])); }
          };
          actions.appendChild(next);
        };
        b.dataset.i = i;
        opts.appendChild(b);
      });
      conv.appendChild(opts); conv.appendChild(fb);
      opts.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    showTurn();
  };

  // Nachsprechen: Stufe 1 mit Text, Stufe 2 nur hören, Stufe 3 vom Deutschen aus
  RENDER.speak = function (s, body, actions, finish) {
    const mode = difficulty();
    const card = el('div', 'card');
    const hint = mode === 1 ? 'Sag es laut.' : mode === 2 ? 'Nur hören, dann laut sagen.' : 'Sag es auf Französisch, dann hör die Lösung.';
    card.appendChild(el('div', 'prompt', hint));
    const fr = el('p', 'lang small' + (mode === 1 ? '' : ' hidden'), esc(s.fr));
    const de = el('div', 'de', esc(s.de));
    let helped = false;
    if (mode === 3) { de.className = 'lang small'; card.appendChild(de); card.appendChild(fr); fr.style.marginTop = '14px'; }
    else {
      // Übersetzung erst auf Wunsch, das kostet einen Teil der Punkte
      de.style.display = 'none';
      card.appendChild(fr); card.appendChild(de);
      const tr = el('button', 'btn quiet', 'Traduction'); tr.style.marginTop = '10px';
      tr.onclick = () => { helped = true; de.style.display = ''; tr.remove(); };
      card.appendChild(tr);
    }

    const listen = el('div', 'listen');
    const play = el('button', 'btn', ICON.sound + (mode === 3 ? ' Écouter la solution' : ' Écouter'));
    const slow = el('button', 'btn', 'Lentement');
    play.onclick = () => { speak(s.fr); if (mode === 3) fr.classList.remove('hidden'); };
    slow.onclick = () => { speak(s.fr, 0.7); if (mode === 3) fr.classList.remove('hidden'); };
    listen.appendChild(play); listen.appendChild(slow);
    card.appendChild(listen);
    if (mode === 2) {
      const show = el('button', 'btn quiet', 'Afficher le texte'); show.style.marginTop = '10px';
      show.onclick = () => { fr.classList.remove('hidden'); show.remove(); };
      card.appendChild(show);
    }

    body.appendChild(card);

    if (mode !== 3) speak(s.fr);

    actions.className = 'actions row';
    const again = el('button', 'btn', 'Encore');
    const ok = el('button', 'btn ok', 'C’est bon');
    again.onclick = () => { fr.classList.remove('hidden'); de.style.display = ''; markDone('speak', s.id, false); finish(false, 0); };
    ok.onclick = () => { fr.classList.remove('hidden'); de.style.display = ''; markDone('speak', s.id, !helped); finish(!helped, helped ? P()[1] : P()[0]); };
    actions.appendChild(again); actions.appendChild(ok);
  };

  // Text verstehen: Text lesen, dann Fragen nacheinander
  RENDER.texts = function (t, body, actions, finish) {
    const card = el('div', 'card');
    card.appendChild(el('div', 'title', esc(t.title)));
    const textEl = el('p', 'text', esc(t.text));
    card.appendChild(textEl);
    const listen = el('button', 'btn quiet', ICON.sound + ' Écouter'); listen.style.marginTop = '16px';
    listen.onclick = () => speak(t.text);
    card.appendChild(listen);
    const toggle = el('button', 'btn quiet', 'Afficher le texte'); toggle.style.marginTop = '8px'; toggle.style.display = 'none';
    toggle.onclick = () => { const c = textEl.classList.toggle('collapsed'); toggle.textContent = c ? 'Afficher le texte' : 'Réduire le texte'; };
    card.appendChild(toggle);
    body.appendChild(card);
    // Nach der ersten Antwort klappt der Text zusammen, damit der Weiter-Knopf ohne Scrollen erreichbar ist
    function collapseText() { textEl.classList.add('collapsed'); listen.style.display = 'none'; toggle.style.display = ''; toggle.textContent = 'Afficher le texte'; }
    function expandText() { textEl.classList.remove('collapsed'); listen.style.display = ''; toggle.style.display = 'none'; }

    const qcard = el('div', 'card');
    body.appendChild(qcard);
    let qi = 0, right = 0;

    function askQuestion() {
      const q = t.questions[qi];
      qcard.innerHTML = '';
      qcard.appendChild(el('div', 'prompt', 'Question ' + (qi + 1) + ' sur ' + t.questions.length));
      qcard.appendChild(el('div', '', '<strong>' + esc(q.q) + '</strong>'));
      const opts = el('div', 'opts');
      const fb = el('div');
      shuffle(q.options.map((o, i) => ({ o, i }))).forEach(({ o, i }) => {
        const b = el('button', '', esc(o));
        b.onclick = () => {
          const ok = i === q.answer;
          if (ok) right++;
          Array.from(opts.children).forEach(c => { c.disabled = true; if (c.dataset.i == q.answer) c.classList.add('ok'); else if (c !== b) c.style.display = 'none'; });
          if (!ok) b.classList.add('err');
          fb.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'err') + '">' + (ok ? 'Exact.' : 'Presque.') + '</div>';
          collapseText();
          sfx(ok ? 'ok' : 'err');
          qi++;
          actions.innerHTML = '';
          if (qi < t.questions.length) {
            const next = el('button', 'btn dark', 'Question suivante');
            next.onclick = () => { actions.innerHTML = ''; expandText(); askQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
            actions.appendChild(next);

            const all = right === t.questions.length;
            fb.innerHTML += '<div class="note">' + right + ' von ' + t.questions.length + ' richtig.</div>';
            markDone('texts', t.id, all);
            finish(all, right * P()[0]);
            actions.querySelector('.btn') && actions.querySelector('.btn').focus();
          }
        };
        b.dataset.i = i;
        opts.appendChild(b);
      });
      qcard.appendChild(opts);
      qcard.appendChild(fb);
    }
    askQuestion();
  };

  // ---------- Ergebnis ----------
  function renderResult(results, ctx) {
    screen(null);
    app.innerHTML = '';
    const hit = results.filter(r => r.correct).length;
    const helped = results.filter(r => !r.correct && r.pts > 0).length;
    const miss = results.length - hit - helped;
    const pts = results.reduce((a, r) => a + (r.pts || 0), 0);
    const kind = ctx ? ctx.kind : 'module';
    const r = el('div', 'result');
    const actions = el('div', 'actions');

    if (kind === 'etappe') {
      const before = progOf(ctx.station);
      let stationDone = false, unlockedStation = null;
      if (ctx.n > before) { S.prog[ctx.station] = ctx.n; save(); }
      if (ctx.n === 5 && before < 5) { stationDone = true; unlockedStation = C.stations[stIdx(ctx.station) + 1] || null; if (unlockedStation) { S.anim = unlockedStation.id; save(); } }
      const st = C.stations.find(x => x.id === ctx.station), n = progOf(st.id);
      r.innerHTML = resultHead('Étape ' + ctx.n + ' terminée', pts, hit, helped, miss) +
        '<div class="goal"><div class="pills">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= n ? 'done' : '') + '"></i>').join('') + '</div><div class="g">' + esc(st.name) + ', ' + n + ' sur 5 étapes</div></div>';
      app.appendChild(r);
      if (stationDone) {
        setTimeout(() => sfx('unlock'), 300);
        const u = el('div', 'unlock');
        u.innerHTML = '<div class="l" style="display:flex;align-items:center;gap:10px"><span style="color:var(--accent-on-plate);display:flex">' + ICON.hex + '</span>' + esc(st.name) + ' terminé</div>' +
          (unlockedStation ? '<div class="n">' + esc(unlockedStation.name) + '</div><div class="s">' + esc(unlockedStation.theme) + '</div><div class="l" style="margin-top:10px">Neue Wörter und Aufgaben. Die Niveau-Skala unter Exercices libres wächst mit, die Striche können deshalb erst einmal zurückgehen.</div>' : '<div class="n">Voyage terminé</div><div class="s">Alle sieben Stationen geschafft.</div>');
        r.appendChild(u);
      }
      if (n < 5 && !stationDone) { const nx = el('button', 'btn', 'Commencer l’étape ' + (n + 1)); nx.onclick = () => startEtappe(st.id, n + 1, ctx.from); actions.appendChild(nx); }
      const home = el('button', 'btn dark', ctx.from === 'station' ? 'Vers la station' : 'Vers la carte');
      home.onclick = () => ctx.from === 'station' ? renderStation(st.id) : renderHome();
      actions.appendChild(home);
    } else if (kind === 'module') {
      const mod = MODULES.find(m => m.key === ctx.module) || MODULES[0];
      const after = moduleProgress(mod.key).level10, before = ctx.levelBefore || 0;
      r.innerHTML = resultHead(mod.name, pts, hit, helped, miss) +
        '<div class="goal"><div class="lvl" style="text-align:center">' + ticksHtml(after) + '</div><div class="g">Niveau ' + Math.floor(after) + ' sur 10' + (Math.floor(after) > Math.floor(before) ? ', vorher ' + Math.floor(before) : '') + '</div></div>';
      app.appendChild(r);
      if (Math.floor(after) > Math.floor(before)) setTimeout(() => sfx('unlock'), 300);
      const again = el('button', 'btn', 'Encore');
      again.onclick = () => runQueue(buildQueue(mod.key), [], { kind: 'module', module: mod.key, levelBefore: after });
      const back = el('button', 'btn dark', 'Vue d’ensemble');
      back.onclick = renderModules;
      actions.appendChild(again); actions.appendChild(back);
    } else {
      r.innerHTML = resultHead('Programme du jour terminé', pts, hit, helped, miss);
      app.appendChild(r);
      const home = el('button', 'btn dark', 'Vers la carte');
      home.onclick = renderHome;
      actions.appendChild(home);
    }
    app.appendChild(actions);
  }
  function resultHead(head, pts, hit, helped, miss) {
    return '<div class="of">' + esc(head) + '</div>' +
      '<div class="big gold">+' + pts + '</div><div class="of">points</div>' +
      '<div class="tally">' + hit + ' sofort richtig, ' + helped + ' mit Hilfe, ' + miss + ' daneben</div>';
  }

  // ---------- Spielstand übertragen ----------
  function encodeState() {
    const compact = { p: S.points, pr: S.prog, nm: S.name || '', dir: S.direction, ar: S.autoRead, so: S.sound, vn: S.voiceName || '', v: {}, d: S.done, t: today() };
    Object.keys(S.vocab).forEach(id => { compact.v[id] = [S.vocab[id].lvl, S.vocab[id].last]; });
    return btoa(unescape(encodeURIComponent(JSON.stringify(compact)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeState(code) {
    code = code.trim().replace(/-/g, '+').replace(/_/g, '/');
    while (code.length % 4) code += '=';
    const c = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (typeof c.p !== 'number' || typeof c.v !== 'object') throw new Error('bad');
    return c;
  }
  function renderTransfer() {
    screen(renderSettings);
    app.innerHTML = '';
    const top = el('div', 'top');
    const back = el('button', 'back', ICON.back);
    back.onclick = renderSettings;
    top.appendChild(back);
    top.appendChild(el('div', '', '<div>Transfert</div><div class="sub">Spielstand, ' + S.points + ' points</div>'));
    app.appendChild(top);

    const out = el('div', 'card');
    out.appendChild(el('div', 'prompt', 'Dieser Code enthält Punkte, Vokabelstand und erledigte Übungen. Auf dem anderen Gerät unten einfügen.'));
    const code = encodeState();
    out.appendChild(el('div', 'code', esc(code)));
    const row = el('div', 'inrow');
    const copy = el('button', 'btn primary', 'Code kopieren');
    copy.onclick = () => {
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => { copy.textContent = 'Kopiert'; }, () => { copy.textContent = 'Bitte markieren und kopieren'; });
      else copy.textContent = 'Bitte markieren und kopieren';
    };
    row.appendChild(copy);
    if (navigator.share) {
      const share = el('button', 'btn', 'Teilen');
      share.onclick = () => navigator.share({ title: 'Français Spielstand', text: code }).catch(() => {});
      row.appendChild(share);
    }
    out.appendChild(row);
    app.appendChild(out);

    const inn = el('div', 'card');
    inn.appendChild(el('div', 'prompt', 'Code von einem anderen Gerät einfügen. Der Spielstand hier wird dabei ersetzt.'));
    const ta = el('textarea'); ta.placeholder = 'Code hier einfügen'; ta.spellcheck = false; ta.autocapitalize = 'off';
    inn.appendChild(ta);
    const fb = el('div');
    const btn = el('button', 'btn primary', 'Spielstand übernehmen'); btn.style.marginTop = '12px'; btn.style.width = '100%';
    btn.onclick = () => {
      try {
        const c = decodeState(ta.value);
        if (!confirm('Spielstand mit ' + c.p + ' Punkten übernehmen? Der aktuelle Stand auf diesem Gerät wird ersetzt.')) return;
        S.points = c.p; S.prog = c.pr || {}; if (c.nm) S.name = c.nm; S.direction = c.dir || 'de-fr'; if (c.ar !== undefined) S.autoRead = c.ar; if (c.so !== undefined) S.sound = c.so; if (c.vn) S.voiceName = c.vn; S.done = c.d || {}; S.vocab = {}; S.daily = null;
        Object.keys(c.v).forEach(id => { S.vocab[id] = { lvl: c.v[id][0], last: c.v[id][1] }; });
        save();
        renderHome();
      } catch (e) {
        fb.innerHTML = '<div class="feedback err">Der Code ist unvollständig oder beschädigt. Bitte den ganzen Code einfügen.</div>';
      }
    };
    inn.appendChild(btn); inn.appendChild(fb);
    app.appendChild(inn);

    const foot = el('div', 'foot');
    const reset = el('button', '', 'Fortschritt auf diesem Gerät löschen');
    reset.onclick = () => { if (confirm('Gesamten Fortschritt auf diesem Gerät löschen?')) { localStorage.removeItem(STORE_KEY); location.reload(); } };
    foot.appendChild(reset);
    app.appendChild(foot);
  }

  // ---------- Start ----------
  renderHome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
