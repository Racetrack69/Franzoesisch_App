<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDE3D1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Français">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Français</title>
<style>
  :root {
    --bg: #EDE3D1;          /* Sable */
    --card: #F8F3E8;        /* Papier */
    --field: #FFFCF5;
    --ink: #16253C;         /* Encre */
    --muted: #5E5747;
    --faint: #A0947D;
    --line: #DCCFB6;
    --line-strong: #C0B49B;
    --accent: #B8412C;      /* Vermillon */
    --accent-ink: #FFF8EC;
    --accent-soft: #F5E3DC;
    --gold: #B5822A;        /* Ocre */
    --ok: #4A6B52;          /* Sauge */
    --ok-soft: #E7EEE4;
    --ok-ink: #35503B;
    --err: #B8412C;
    --err-soft: #F5E3DC;
    --plate: #16253C;
    --plate-ink: #F8F3E8;
    --plate-line: #8C9AB0;
    --plate-mute: #C3B9A5;
    --plate-rail: #3A4A63;
    --serif: "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131E2E;
      --card: #1C2A3D;
      --field: #162333;
      --ink: #F2E8D8;
      --muted: #A69B88;
      --faint: #7D8CA3;
      --line: #2E3E55;
      --line-strong: #43556F;
      --accent: #E07A63;
      --accent-ink: #16253C;
      --accent-soft: #3A2A28;
      --gold: #D7A34A;
      --ok: #7FA987;
      --ok-soft: #22332A;
      --ok-ink: #A8C9AE;
      --err: #E07A63;
      --err-soft: #3A2A28;
      --plate: #E0D3BC;
      --plate-ink: #16253C;
      --plate-line: #A8977B;
      --plate-mute: #57503F;
      --plate-rail: #C2B195;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Kopfzeile */
  .top { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 16px; }
  .top h1 { font-family: var(--serif); font-weight: 500; font-size: 42px; margin: 0; line-height: 1; letter-spacing: -0.01em; }
  .top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .back { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 4px; margin-left: -12px; }
  .back:active { background: var(--accent-soft); }
  .headpts { margin-left: auto; text-align: right; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Zähler und mitlaufender Punktestand */
  .counter { margin-left: auto; text-align: right; position: relative; }
  .counter .of { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .counter .score { font-family: var(--serif); font-size: 21px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .counter .score.pop { animation: pop .45s ease; }
  .gain {
    position: absolute; right: 0; top: 44px;
    font-family: var(--serif); font-size: 21px; color: var(--gold);
    font-variant-numeric: tabular-nums; pointer-events: none;
    animation: rise 1s ease forwards;
  }
  @keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }

  .bar { height: 2px; background: var(--line); margin-bottom: 20px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

  /* Startseite */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .seg button { height: 44px; color: var(--ink); font-size: 15px; border-left: 1px solid var(--ink); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--ink); color: var(--bg); font-weight: 500; }

  .daily { display: block; width: 100%; text-align: left; background: var(--plate); border-radius: 6px; padding: 8px; margin-bottom: 16px; }
  .daily .keyline { border: 1px solid var(--plate-line); border-radius: 3px; padding: 22px 20px 20px; }
  .daily .t { font-family: var(--serif); font-size: 32px; color: var(--plate-ink); line-height: 1.1; }
  .daily .d { font-size: 15px; color: var(--plate-mute); margin-top: 8px; }
  .daily .rule { height: 1px; background: var(--plate-rail); margin: 18px 0 14px; }
  .daily .row { display: flex; align-items: center; gap: 10px; }
  .daily .track { flex: 1; height: 5px; background: var(--plate-rail); border-radius: 3px; overflow: hidden; }
  .daily .track i { display: block; height: 100%; background: var(--gold); }
  .daily .num { font-size: 13px; color: var(--plate-mute); font-variant-numeric: tabular-nums; }

  .mapbtn { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; margin-bottom: 18px; }
  .mapbtn .t { font-family: var(--serif); font-size: 21px; }
  .mapbtn .d { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .modules { list-style: none; margin: 0; padding: 0; }
  .modules li { border-bottom: 1px solid var(--line); }
  .modules li:last-child { border-bottom: 0; }
  .modules button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 15px 2px; }
  .modules .n { flex: 1; font-size: 17px; font-weight: 500; }
  .modules .n small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .modules .pct { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .modules .chev { color: var(--faint); display: flex; }
  .foot { margin-top: auto; padding-top: 28px; color: var(--muted); font-size: 13px; display: flex; gap: 16px; justify-content: space-between; }
  .foot button { text-decoration: underline; color: var(--muted); text-underline-offset: 3px; }

  /* Übungskarte */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 26px 22px 22px; margin-bottom: 16px; }
  .lang { font-family: var(--serif); font-size: 40px; line-height: 1.1; margin: 0; }
  .lang.small { font-size: 28px; }
  .lang.hidden { color: transparent; text-shadow: 0 0 14px var(--faint); user-select: none; }
  .ctx { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--muted); margin-top: 8px; }
  .de { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .prompt { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .theme { color: var(--muted); font-size: 13px; }
  .text { font-family: var(--serif); font-size: 21px; line-height: 1.5; margin: 0; }
  .text.hidden { color: transparent; text-shadow: 0 0 14px var(--faint); user-select: none; }
  .title { font-family: var(--serif); font-size: 15px; color: var(--muted); margin-bottom: 8px; }

  label.field { display: block; font-size: 13px; color: var(--muted); margin: 22px 0 7px; }
  input[type=text] {
    width: 100%; font-family: var(--serif); font-size: 26px; height: 56px; padding: 0 14px;
    border: 1px solid var(--ink); border-radius: 4px; background: var(--field); color: var(--ink);
  }
  input[type=text].ok { border-color: var(--ok); }
  input[type=text].err { border-color: var(--err); }

  .feedback { border-radius: 4px; padding: 14px 16px; margin-top: 16px; font-size: 15px; }
  .feedback.ok { background: var(--ok-soft); color: var(--ok-ink); }
  .feedback.err { background: var(--err-soft); color: var(--accent); }
  .feedback.hint { background: var(--accent-soft); color: var(--accent); }
  .feedback b { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--ink); }
  .feedback .tip { font-family: var(--serif); font-size: 16px; color: var(--ink); margin-top: 8px; line-height: 1.5; opacity: .9; }

  .opts { display: grid; gap: 10px; margin-top: 16px; }
  .opts button { text-align: left; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--field); font-size: 17px; }
  .opts button.fr { font-family: var(--serif); font-size: 22px; }
  .opts button.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); }
  .opts button.err { border-color: var(--err); background: var(--err-soft); color: var(--accent); }
  .opts button:disabled { cursor: default; }

  .words { display: flex; flex-wrap: wrap; gap: 8px 6px; margin-top: 6px; }
  .words button { font-family: var(--serif); font-size: 25px; line-height: 1.2; padding: 6px 9px; border-radius: 4px; border: 1px solid transparent; background: var(--field); }
  .words button.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); }
  .words button.err { border-color: var(--err); background: var(--err-soft); color: var(--accent); text-decoration: line-through; }
  .words button:disabled { cursor: default; }

  .actions { display: grid; gap: 10px; margin-top: auto; padding-top: 6px; }
  .actions.row { grid-template-columns: 1fr 1fr; }
  .btn { padding: 0 18px; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 4px; font-size: 16px; text-align: center; border: 1px solid var(--line-strong); background: transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .btn.ok { background: var(--ok); color: #FFF8EC; border-color: var(--ok); font-weight: 600; }
  .btn.quiet { color: var(--muted); min-height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .inrow { display: flex; gap: 10px; margin-top: 14px; }
  .inrow .btn { flex: 1; }
  .listen { display: flex; gap: 10px; margin-top: 18px; }
  .listen .btn { flex: 1; }

  /* Ergebnis */
  .result { text-align: center; padding: 40px 0 20px; }
  .result .big { font-family: var(--serif); font-size: 96px; line-height: 1; font-variant-numeric: tabular-nums; }
  .result .of { color: var(--muted); font-size: 15px; margin-top: 10px; }
  .result .plate { display: inline-flex; align-items: baseline; gap: 8px; margin-top: 22px; padding: 9px 16px; background: var(--plate); border-radius: 3px; }
  .result .plate .p { font-family: var(--serif); font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .result .plate .l { font-size: 14px; color: var(--plate-mute); }
  .result p { color: var(--muted); font-size: 15px; margin-top: 30px; }
  .unlock { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px; margin-top: 34px; }
  .unlock .l { font-size: 13px; color: var(--muted); }
  .unlock .n { font-family: var(--serif); font-size: 30px; margin-top: 10px; }
  .unlock .s { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--muted); margin-top: 6px; }

  .note { color: var(--muted); font-size: 13px; margin-top: 12px; }

  /* Karte */
  .map { width: 100%; height: auto; display: block; }
  .map .land { fill: var(--field); stroke: var(--line-strong); stroke-width: 1.4; }
  .map .place { font-family: var(--serif); font-size: 16px; fill: var(--faint); cursor: pointer; }
  .map .place.on { fill: var(--accent); font-weight: 600; }
  .map .glow { fill: var(--accent); opacity: .14; }
  .map .dot { fill: var(--faint); }
  .map .dot.on { fill: var(--accent); }
  .place-card .fr { font-family: var(--serif); font-size: 19px; line-height: 1.45; margin: 0; }
  .place-card .de { margin: 4px 0 14px; }
  .place-card .rule { height: 1px; background: var(--line); margin: 16px 0 14px; }

  textarea { width: 100%; font-family: var(--sans); font-size: 14px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--field); color: var(--ink); min-height: 110px; word-break: break-all; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .bar i { transition: none; }
    .gain, .counter .score.pop { animation: none; }
    .gain { opacity: .9; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
(function () {
  'use strict';
  const C = window.CONTENT;
  const STORE_KEY = 'francais-app-v1';
  const DAILY_MIX = { vocab: 10, errors: 3, speak: 3, texts: 1, tenses: 4 };
  // Punkte je Stufe: [richtig, mit Hilfe]
  const POINTS = { 1: [2, 1], 2: [3, 1], 3: [4, 2] };
  const P = () => POINTS[S.level] || POINTS[1];
  const MODULES = [
    { key: 'vocab',  name: 'Vokabeln',        sub: 'Eintippen, bei Bedarf Hilfe' },
    { key: 'errors', name: 'Fehler finden',   sub: 'Das falsche Wort antippen' },
    { key: 'speak',  name: 'Nachsprechen',    sub: 'Anhören, nachsprechen, einschätzen' },
    { key: 'texts',  name: 'Text verstehen',  sub: 'Kurzer Text, drei Fragen' },
    { key: 'tenses', name: 'Zeiten und Formen', sub: 'Die passende Form wählen' }
  ];

  // ---------- Speicher ----------
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === 'object') return s;
    } catch (e) {}
    return { level: 1, direction: 'de-fr', vocab: {}, done: {}, daily: null, points: 0 };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  const S = load();
  S.vocab = S.vocab || {}; S.done = S.done || {}; S.level = S.level || 1; S.direction = S.direction || 'de-fr'; S.points = S.points || 0;

  // ---------- Symbole ----------
  const ICON = {
    back: '<svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9.5 1 L1.5 9 L9.5 17"/></svg>',
    chev: '<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 1 L7 7 L1 13"/></svg>',
    sound: '<svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 6.5 L5.5 6.5 L9.5 3 L9.5 15 L5.5 11.5 L2 11.5 Z"/><path d="M12.6 6.2 A4 4 0 0 1 12.6 11.8"/></svg>',
    hex: '<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M17 3.5 L28.7 10.25 L28.7 23.75 L17 30.5 L5.3 23.75 L5.3 10.25 Z"/><circle cx="18.5" cy="14" r="2.2" fill="currentColor" stroke="none"/></svg>'
  };

  // ---------- Helfer ----------
  const app = document.getElementById('app');
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const today = () => new Date().toISOString().slice(0, 10);
  const byLevel = (list) => list.filter(x => x.level === S.level);
  const findItem = (type, id) => C[type].find(x => x.id === id);

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[’`´]/g, "'")
      .replace(/œ/g, 'oe').replace(/æ/g, 'ae').replace(/ß/g, 'ss')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[.!?,;:]/g, '')
      .replace(/\s+/g, ' ').trim();
  }
  const ART_FR = /^(le|la|les|un|une|des|l')\s*/;
  const ART_DE = /^(der|die|das|ein|eine)\s+/;
  function stripArticle(s, lang) { return norm(s).replace(lang === 'fr' ? ART_FR : ART_DE, '').trim(); }
  function hasArticle(s, lang) { return (lang === 'fr' ? ART_FR : ART_DE).test(norm(s)); }

  // ---------- Sprachausgabe ----------
  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    voice = vs.find(v => v.lang.toLowerCase() === 'fr-fr' && v.localService) || vs.find(v => v.lang.toLowerCase() === 'fr-fr') || vs[0] || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, rate) {
    if (!('speechSynthesis' in window)) { alert('Dieser Browser kann keine Sprachausgabe.'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = C.meta.lang; u.rate = rate || 0.95;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  // ---------- Fortschritt ----------
  function vocabLevel(id) { return (S.vocab[id] && S.vocab[id].lvl) || 0; }
  function bumpVocab(id, delta) {
    const v = S.vocab[id] || { lvl: 0, last: 0 };
    v.lvl = Math.max(0, Math.min(3, v.lvl + delta)); v.last = Date.now();
    S.vocab[id] = v; save();
  }
  function markDone(type, id, correct) { S.done[type] = S.done[type] || {}; S.done[type][id] = correct ? 2 : 1; save(); }
  function isDone(type, id) { return !!(S.done[type] && S.done[type][id]); }

  function moduleProgress(key) {
    const items = byLevel(C[key]);
    if (!items.length) return { text: 'Noch keine Inhalte', pct: 0 };
    if (key === 'vocab') {
      const learned = items.filter(v => vocabLevel(v.id) >= 3).length;
      return { text: learned + ' von ' + items.length + ' sicher', pct: learned / items.length };
    }
    const done = items.filter(x => isDone(key, x.id)).length;
    return { text: done + ' von ' + items.length, pct: done / items.length };
  }

  // ---------- Auswahl der Übungen ----------
  function pickVocab(n) {
    const items = byLevel(C.vocab).map(v => ({ v, lvl: vocabLevel(v.id), last: (S.vocab[v.id] || {}).last || 0, r: Math.random() }));
    items.sort((a, b) => a.lvl - b.lvl || a.last - b.last || a.r - b.r);
    return items.slice(0, n).map(x => ({ type: 'vocab', id: x.v.id }));
  }
  function pickOther(type, n) {
    const items = byLevel(C[type]);
    const fresh = shuffle(items.filter(x => !isDone(type, x.id)));
    const rest = shuffle(items.filter(x => isDone(type, x.id)));
    return fresh.concat(rest).slice(0, n).map(x => ({ type, id: x.id }));
  }
  function buildQueue(type) {
    if (type === 'vocab') return pickVocab(10);
    const counts = { errors: 5, speak: 4, texts: 1, tenses: 5 };
    return pickOther(type, counts[type]);
  }
  function buildDaily() {
    return shuffle([]
      .concat(pickVocab(DAILY_MIX.vocab))
      .concat(pickOther('errors', DAILY_MIX.errors))
      .concat(pickOther('speak', DAILY_MIX.speak))
      .concat(pickOther('texts', DAILY_MIX.texts))
      .concat(pickOther('tenses', DAILY_MIX.tenses)));
  }
  function dailyState() {
    if (!S.daily || S.daily.date !== today() || S.daily.level !== S.level) {
      S.daily = { date: today(), level: S.level, items: buildDaily(), results: [] };
      save();
    }
    return S.daily;
  }

  // ---------- Startseite ----------
  function renderHome() {
    app.innerHTML = '';
    const top = el('div', 'top');
    top.appendChild(el('div', '', '<h1>' + esc(C.meta.title) + '</h1>'));
    top.appendChild(el('div', 'headpts', S.points + ' Punkte'));
    app.appendChild(top);

    const seg = el('div', 'seg');
    [1, 2, 3].forEach(l => {
      const b = el('button', l === S.level ? 'on' : '', 'Stufe ' + l);
      b.onclick = () => { S.level = l; save(); renderHome(); };
      seg.appendChild(b);
    });
    app.appendChild(seg);

    const d = dailyState();

  // ---------- Ablauf einer Übungsreihe ----------
  // queue: [{type, id}], results: [{correct}], daily: true wenn Tagesprogramm (Ergebnisse werden gespeichert)
  function runQueue(queue, results, daily) {
    if (!queue.length) { renderHome(); return; }
    const idx = results.length;
    if (idx >= queue.length) { renderResult(results, daily); return; }
    const ref = queue[idx];
    const item = findItem(ref.type, ref.id);
    const mod = MODULES.find(m => m.key === ref.type);

    app.innerHTML = '';
    const top = el('div', 'top');
    const back = el('button', 'back', ICON.back);
    back.setAttribute('aria-label', 'Zurück');
    back.onclick = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); renderHome(); };
    top.appendChild(back);
    top.appendChild(el('div', '', '<div>' + (daily ? 'Tagesprogramm' : mod.name) + '</div><div class="sub">' + (daily ? mod.name : 'Stufe ' + S.level) + '</div>'));
    const counter = el('div', 'counter');
    counter.innerHTML = '<div class="of">' + (idx + 1) + ' / ' + queue.length + '</div>' +
      '<div class="score">' + S.points + '</div>';
    top.appendChild(counter);
    app.appendChild(top);
    const bar = el('div', 'bar', '<i></i>');
    app.appendChild(bar);
    requestAnimationFrame(() => { bar.firstChild.style.width = (idx / queue.length * 100) + '%'; });

    const body = el('div');
    app.appendChild(body);
    const actions = el('div', 'actions');
    app.appendChild(actions);

    const finish = (correct, pts) => {
      pts = pts || 0;
      const from = S.points;
      results.push({ type: ref.type, id: ref.id, correct: !!correct, pts });
      S.points += pts;
      save();
      if (pts > 0) awardPoints(counter, from, S.points, pts);
      actions.className = 'actions';
      actions.innerHTML = '';
      const next = el('button', 'btn dark', idx + 1 < queue.length ? 'Weiter' : 'Fertig');
      next.onclick = () => runQueue(queue, results, daily);
      actions.appendChild(next);
      next.focus();
    };

    RENDER[ref.type](item, body, actions, finish);
  }

  // Punktestand im Kopf hochzählen und den Zugewinn kurz einblenden
  function awardPoints(counter, from, to, pts) {
    const score = counter.querySelector('.score');
    if (!score) return;
    const gain = el('div', 'gain', '+' + pts);
    counter.appendChild(gain);
    setTimeout(() => gain.remove(), 1100);
    score.classList.add('pop');
    setTimeout(() => score.classList.remove('pop'), 500);
    const slow = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (slow) { score.textContent = to; return; }
    const steps = Math.min(pts, 8), dur = 420;
    let i = 0;
    const tick = setInterval(() => {
      i++;
      score.textContent = Math.round(from + (to - from) * (i / steps));
      if (i >= steps) { clearInterval(tick); score.textContent = to; }
    }, dur / steps);
  }

  const RENDER = {};

  // Vokabel: eintippen, Hilfe mit 4 Optionen
  RENDER.vocab = function (v, body, actions, finish) {
    const toFr = S.direction === 'de-fr';
    const prompt = toFr ? v.de : v.fr;
    const target = toFr ? v.fr : v.de;
    const lang = toFr ? 'fr' : 'de';
    const accepted = [target].concat(toFr ? (v.alt || []) : (v.altDe || [])).map(norm);
    const ctx = toFr ? v.ctxDe : v.ctxFr;

    const card = el('div', 'card');
    card.appendChild(el('div', 'theme', esc(v.theme)));
    card.appendChild(el('p', 'lang' + (toFr ? '' : ' small'), esc(prompt)));
    if (ctx) card.appendChild(el('div', 'ctx', esc(ctx)));
    if (!toFr) { const b = el('button', 'btn quiet', ICON.sound + ' Anhören'); b.style.marginTop = '14px'; b.onclick = () => speak(v.fr); card.appendChild(b); }
    const lab = el('label', 'field', toFr ? 'Übersetzung auf Französisch, mit Artikel' : 'Übersetzung auf Deutsch, mit Artikel');
    lab.setAttribute('for', 'answer');
    const input = el('input');
    input.type = 'text'; input.id = 'answer'; input.autocapitalize = 'off'; input.autocomplete = 'off'; input.spellcheck = false;
    input.setAttribute('lang', toFr ? 'fr' : 'de');
    card.appendChild(lab); card.appendChild(input);
    const fb = el('div');
    card.appendChild(fb);
    body.appendChild(card);

    let articleHintGiven = false;
    let settled = false;

    const check = el('button', 'btn primary', 'Prüfen');
    const help = el('button', 'btn', 'Hilfe');
    const row = el('div', 'inrow');
    row.appendChild(help); row.appendChild(check);
    card.insertBefore(row, fb);

    function reveal(ok, delta, msg) {
      settled = true;
      input.disabled = true;
      input.className = ok ? 'ok' : 'err';
      fb.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'err') + '">' + msg + '<b>' + esc(target) + '</b>' +
        (v.tip ? '<div class="tip">' + esc(v.tip) + '</div>' : '') + '</div>';
      const listen = el('button', 'btn quiet', ICON.sound + ' Anhören'); listen.style.marginTop = '10px';
      listen.onclick = () => speak(v.fr);
      fb.appendChild(listen);
      bumpVocab(v.id, delta);
      row.remove();
      finish(ok, ok ? P()[0] : 0);
    }

    function doCheck() {
      if (settled) return;
      const a = norm(input.value);
      if (!a) { input.focus(); return; }
      if (accepted.includes(a)) { reveal(true, +1, 'Richtig: '); return; }
      const targetHasArticle = hasArticle(target, lang);
      if (targetHasArticle && !articleHintGiven && !hasArticle(a, lang) && a === stripArticle(target, lang)) {
        articleHintGiven = true;
        fb.innerHTML = '<div class="feedback hint">Fast. Der Artikel fehlt noch.</div>';
        input.focus();
        return;
      }
      reveal(false, -1, 'Leider nicht. Richtig ist: ');
    }
    check.onclick = doCheck;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doCheck(); } });

    help.onclick = () => {
      if (settled) return;
      settled = true;
      input.disabled = true;
      const pool = C.vocab.filter(x => x.id !== v.id && norm(toFr ? x.fr : x.de) !== norm(target));
      const same = pool.filter(x => x.theme === v.theme);
      const distract = shuffle(same.length >= 3 ? same : pool).slice(0, 3).map(x => toFr ? x.fr : x.de);
      const opts = el('div', 'opts');
      shuffle([target].concat(distract)).forEach(o => {
        const b = el('button', toFr ? 'fr' : '', esc(o));
        b.onclick = () => {
          const ok = norm(o) === norm(target);
          Array.from(opts.children).forEach(c => { c.disabled = true; if (norm(c.textContent) === norm(target)) c.classList.add('ok'); });
          if (!ok) b.classList.add('err');
          fb.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'err') + '">' + (ok ? 'Richtig, mit Hilfe. ' : 'Leider nicht. Richtig ist: ') + '<b>' + esc(target) + '</b>' +
            (v.tip ? '<div class="tip">' + esc(v.tip) + '</div>' : '') + '</div>';
          const listen = el('button', 'btn quiet', ICON.sound + ' Anhören'); listen.style.marginTop = '10px';
          listen.onclick = () => speak(v.fr);
          fb.appendChild(listen);
          bumpVocab(v.id, ok ? 0 : -1);
          row.remove();
          finish(false, ok ? P()[1] : 0);
        };
        opts.appendChild(b);
      });
      fb.innerHTML = '';
      fb.appendChild(opts);
    };
    setTimeout(() => input.focus(), 50);
  };

  // Nachsprechen: Stufe 1 mit Text, Stufe 2 nur hören, Stufe 3 vom Deutschen aus
  RENDER.speak = function (s, body, actions, finish) {
    const mode = S.level;
    const card = el('div', 'card');
    const hint = mode === 1 ? 'Anhören und nachsprechen.' : mode === 2 ? 'Nur anhören, dann nachsprechen. Der Text bleibt verdeckt.' : 'Sag den Satz auf Französisch. Danach die Lösung anhören.';
    card.appendChild(el('div', 'prompt', hint));
    const fr = el('p', 'lang small' + (mode === 1 ? '' : ' hidden'), esc(s.fr));
    const de = el('div', 'de', esc(s.de));
    if (mode === 3) { de.className = 'lang small'; card.appendChild(de); card.appendChild(fr); fr.style.marginTop = '14px'; }
    else { card.appendChild(fr); card.appendChild(de); }

    const listen = el('div', 'listen');
    const play = el('button', 'btn', ICON.sound + (mode === 3 ? ' Lösung anhören' : ' Anhören'));
    const slow = el('button', 'btn', 'Langsam');
    play.onclick = () => { speak(s.fr); if (mode === 3) fr.classList.remove('hidden'); };
    slow.onclick = () => { speak(s.fr, 0.7); if (mode === 3) fr.classList.remove('hidden'); };
    listen.appendChild(play); listen.appendChild(slow);
    card.appendChild(listen);
    if (mode === 2) {
      const show = el('button', 'btn quiet', 'Text anzeigen'); show.style.marginTop = '10px';
      show.onclick = () => { fr.classList.remove('hidden'); show.remove(); };
      card.appendChild(show);
    }
    body.appendChild(card);

    if (mode !== 3) speak(s.fr);

    actions.className = 'actions row';
    const again = el('button', 'btn', 'Nochmal üben');
    const ok = el('button', 'btn ok', 'Klappt');
    again.onclick = () => { fr.classList.remove('hidden'); markDone('speak', s.id, false); finish(false, 0); };
    ok.onclick = () => { fr.classList.remove('hidden'); markDone('speak', s.id, true); finish(true, P()[0]); };
    actions.appendChild(again); actions.appendChild(ok);
  };

  // Text verstehen: Text lesen, dann Fragen nacheinander
  RENDER.texts = function (t, body, actions, finish) {
    const card = el('div', 'card');
    card.appendChild(el('div', 'title', esc(t.title)));
    card.appendChild(el('p', 'text', esc(t.text)));

    const qcard = el('div', 'card');
    body.appendChild(qcard);
    let qi = 0, right = 0;

    function askQuestion() {
      const q = t.questions[qi];
      qcard.innerHTML = '';
      qcard.appendChild(el('div', 'prompt', 'Frage ' + (qi + 1) + ' von ' + t.questions.length));
      qcard.appendChild(el('div', '', '<strong>' + esc(q.q) + '</strong>'));
      const opts = el('div', 'opts');
      const fb = el('div');
      shuffle(q.options.map((o, i) => ({ o, i }))).forEach(({ o, i }) => {
        const b = el('button', '', esc(o));
        b.onclick = () => {

          Array.from(opts.children).forEach(c => { c.disabled = true; if (c.dataset.i == q.answer) c.classList.add('ok'); });
          if (!ok) b.classList.add('err');

            const next = el('button', 'btn primary', 'Nächste Frage');
            next.onclick = () => { actions.innerHTML = ''; askQuestion(); };
            actions.appendChild(next);
          } else {
            const all = right === t.questions.length;
            fb.innerHTML += '<div class="note">' + right + ' von ' + t.questions.length + ' richtig.</div>';
            markDone('texts', t.id, all);
            finish(all, right * P()[0]);
          }
        };
        b.dataset.i = i;
        opts.appendChild(b);
      });
      qcard.appendChild(opts);
      qcard.appendChild(fb);
    }

  };

  // ---------- Frankreichkarte ----------
  // Grober Umriss von Frankreich und Korsika, Koordinaten in Längen-/Breitengrad, vereinfacht.
  const FR_OUTLINE = [[2.4,51.05],[1.85,50.95],[1.6,50.4],[1.4,50.06],[0.7,49.85],[0.1,49.5],[-0.3,49.35],[-1.1,49.35],[-1.6,49.65],[-1.85,49.1],[-1.5,48.64],[-2.0,48.65],[-2.7,48.55],[-3.5,48.8],[-4.5,48.4],[-4.75,48.03],[-4.1,47.98],[-3.4,47.75],[-2.75,47.65],[-2.2,47.27],[-1.8,46.5],[-1.15,46.15],[-1.0,45.6],[-1.2,44.65],[-1.55,43.48],[-1.78,43.37],[-0.5,42.8],[0.7,42.8],[1.7,42.5],[3.05,42.45],[3.0,43.1],[3.7,43.4],[4.1,43.55],[4.9,43.4],[5.4,43.3],[5.93,43.1],[6.65,43.27],[7.27,43.7],[7.5,43.78],[7.0,44.2],[6.9,45.0],[7.1,45.5],[6.8,46.0],[6.1,46.2],[6.0,46.5],[6.9,47.3],[7.6,47.6],[8.1,48.6],[8.2,49.0],[7.3,49.1],[6.4,49.5],[5.5,49.5],[4.9,50.0],[4.2,49.95],[4.1,50.1],[3.6,50.4],[3.2,50.7]];
  const CORSICA = [[9.4,43.0],[9.55,42.6],[9.35,41.5],[9.0,41.4],[8.7,41.9],[8.6,42.3],[9.3,42.7]];
  const proj = (lon, lat) => [((lon + 5.4) * 28).toFixed(1), ((51.4 - lat) * 40.5).toFixed(1)];
  const pathOf = pts => 'M' + pts.map(p => proj(p[0], p[1]).join(',')).join('L') + 'Z';

  function renderMap(openId) {
    app.innerHTML = '';
    const top = el('div', 'top');
    const back = el('button', 'back', ICON.back);
    back.onclick = renderHome;
    top.appendChild(back);
    const unlocked = C.places.filter(pl => S.points >= pl.at).length;
    top.appendChild(el('div', '', '<div>Meine Frankreichkarte</div><div class="sub">' + unlocked + ' von ' + C.places.length + ' Orten, ' + S.points + ' Punkte</div>'));
    app.appendChild(top);

    const card = el('div', 'card'); card.style.padding = '10px';
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 420 410'); svg.setAttribute('class', 'map');
    const land = document.createElementNS(svgNS, 'path'); land.setAttribute('d', pathOf(FR_OUTLINE) + ' ' + pathOf(CORSICA)); land.setAttribute('class', 'land');
    svg.appendChild(land);
    const detail = el('div');
    const labels = [];
    C.places.forEach(pl => {
      const on = S.points >= pl.at;
      const [x, y] = proj(pl.lon, pl.lat);
      if (on) { const g = document.createElementNS(svgNS, 'circle'); g.setAttribute('cx', x); g.setAttribute('cy', y); g.setAttribute('r', 13); g.setAttribute('class', 'glow'); svg.appendChild(g); }
      const d = document.createElementNS(svgNS, 'circle'); d.setAttribute('cx', x); d.setAttribute('cy', y); d.setAttribute('r', on ? 3.4 : 2.6); d.setAttribute('class', 'dot' + (on ? ' on' : '')); svg.appendChild(d);
      const t = document.createElementNS(svgNS, 'text');
      const left = pl.lon > 6.5; // am rechten Rand nach links beschriften
      t.setAttribute('x', +x + (left ? -7 : 7)); t.setAttribute('y', +y + 4 + (pl.dy || 0)); t.setAttribute('class', 'place' + (on ? ' on' : ''));
      if (left) t.setAttribute('text-anchor', 'end');
      t.textContent = pl.name;
      t.onclick = () => showPlace(pl);
      svg.appendChild(t); labels.push(t);
    });
    card.appendChild(svg);
    app.appendChild(card);
    app.appendChild(detail);

    function showPlace(pl) {
      detail.innerHTML = '';
      const pc = el('div', 'card place-card');
      if (S.points >= pl.at) {
        pc.appendChild(el('div', 'theme', esc(pl.name) + ', freigeschaltet bei ' + pl.at + ' Punkten'));
        pc.appendChild(el('p', 'lang small', esc(pl.title)));
        pc.appendChild(el('div', 'rule'));
        pl.fr.forEach((f, i) => { pc.appendChild(el('p', 'fr', esc(f))); pc.appendChild(el('div', 'de', esc(pl.de[i]))); });
        const listen = el('button', 'btn', ICON.sound + ' Anhören');
        listen.onclick = () => speak(pl.fr.join(' '));
        pc.appendChild(listen);
      } else {
        pc.appendChild(el('div', 'theme', esc(pl.name)));
        pc.appendChild(el('div', '', 'Erscheint ab ' + pl.at + ' Punkten. Noch ' + (pl.at - S.points) + ' bis dahin.'));
      }
      detail.appendChild(pc);
      pc.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    if (openId) { const pl = C.places.find(p => p.id === openId); if (pl) showPlace(pl); }
    else app.appendChild(el('div', 'note', 'Tippe auf einen leuchtenden Ort. Blasse Orte warten noch auf Punkte.'));
  }

  // ---------- Spielstand übertragen ----------
  function encodeState() {
    const compact = { p: S.points, l: S.level, dir: S.direction, v: {}, d: S.done, t: today() };
    Object.keys(S.vocab).forEach(id => { compact.v[id] = [S.vocab[id].lvl, S.vocab[id].last]; });
    return btoa(unescape(encodeURIComponent(JSON.stringify(compact)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeState(code) {
    code = code.trim().replace(/-/g, '+').replace(/_/g, '/');
    while (code.length % 4) code += '=';
    const c = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (typeof c.p !== 'number' || typeof c.v !== 'object') throw new Error('bad');
    return c;
  }
  function renderTransfer() {
    app.innerHTML = '';
    const top = el('div', 'top');
    const back = el('button', 'back', ICON.back);
    back.onclick = renderHome;
    top.appendChild(back);
    top.appendChild(el('div', '', '<div>Spielstand übertragen</div><div class="sub">' + S.points + ' Punkte</div>'));
    app.appendChild(top);

    const out = el('div', 'card');
    out.appendChild(el('div', 'prompt', 'Dieser Code enthält Punkte, Vokabelstand und erledigte Übungen. Auf dem anderen Gerät unten einfügen.'));
    const code = encodeState();
    out.appendChild(el('div', 'code', esc(code)));
    const row = el('div', 'inrow');
    const copy = el('button', 'btn primary', 'Code kopieren');
    copy.onclick = () => {
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => { copy.textContent = 'Kopiert'; }, () => { copy.textContent = 'Bitte markieren und kopieren'; });
      else copy.textContent = 'Bitte markieren und kopieren';
    };
    row.appendChild(copy);
    if (navigator.share) {
      const share = el('button', 'btn', 'Teilen');
      share.onclick = () => navigator.share({ title: 'Français Spielstand', text: code }).catch(() => {});
      row.appendChild(share);
    }
    out.appendChild(row);
    app.appendChild(out);

    const inn = el('div', 'card');
    inn.appendChild(el('div', 'prompt', 'Code von einem anderen Gerät einfügen. Der Spielstand hier wird dabei ersetzt.'));
    const ta = el('textarea'); ta.placeholder = 'Code hier einfügen'; ta.spellcheck = false; ta.autocapitalize = 'off';
    inn.appendChild(ta);
    const fb = el('div');
    const btn = el('button', 'btn primary', 'Spielstand übernehmen'); btn.style.marginTop = '12px'; btn.style.width = '100%';
    btn.onclick = () => {
      try {
        const c = decodeState(ta.value);
        if (!confirm('Spielstand mit ' + c.p + ' Punkten übernehmen? Der aktuelle Stand auf diesem Gerät wird ersetzt.')) return;
        S.points = c.p; S.level = c.l || 1; S.direction = c.dir || 'de-fr'; S.done = c.d || {}; S.vocab = {}; S.daily = null;
        Object.keys(c.v).forEach(id => { S.vocab[id] = { lvl: c.v[id][0], last: c.v[id][1] }; });
        save();
        renderHome();
      } catch (e) {
        fb.innerHTML = '<div class="feedback err">Der Code ist unvollständig oder beschädigt. Bitte den ganzen Code einfügen.</div>';
      }
    };
    inn.appendChild(btn); inn.appendChild(fb);
    app.appendChild(inn);

    const foot = el('div', 'foot');
    const reset = el('button', '', 'Fortschritt auf diesem Gerät löschen');
    reset.onclick = () => { if (confirm('Gesamten Fortschritt auf diesem Gerät löschen?')) { localStorage.removeItem(STORE_KEY); location.reload(); } };
    foot.appendChild(reset);
    app.appendChild(foot);
  }

  // ---------- Start ----------
  renderHome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
